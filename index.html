<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Race - Name Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo-duck">🦆</div>
    <div>
        <div class="small-title">FREE TO PLAY</div>
        <h1>Duck Race <span>Name Picker</span></h1>
    </div>
</header>

<main>

    <!-- Đồng hồ -->
    <section class="top-area">
        <div class="timer">
            <span id="timer">00:00:00</span>
        </div>
    </section>

    <!-- Đường đua -->
    <section class="race-area">

        <div class="finish-line">
            <div>FINISH</div>
        </div>

        <div id="raceTrack"></div>

    </section>

    <!-- Nút -->
    <section class="controls">

        <button id="editBtn" class="green-btn">
            ☷ Edit List
        </button>

        <button id="startBtn" class="start-btn">
            🏁 START RACE!
        </button>

        <button id="resetBtn" class="reset-btn">
            ↻
        </button>

    </section>

</main>

<!-- Hộp chỉnh danh sách -->
<div id="editPanel" class="modal hidden">

    <div class="modal-box">

        <h2>Danh sách vịt</h2>

        <p>Nhập tên, mỗi dòng là một con vịt:</p>

        <textarea id="nameInput">Nghĩa
Đan Mạch
Đại Bàng Đen
Tốc Độ Sấm
Hoàng Tử Vịt
Siêu Vịt
Vịt Xanh
Vịt Lửa</textarea>

        <div class="modal-buttons">

            <button id="saveBtn" class="green-btn">
                Lưu danh sách
            </button>

            <button id="closeBtn" class="gray-btn">
                Đóng
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>
<audio id="raceMusic" loop>
    <source src="nhac_kich_tinh_don_da..." type="audio/mpeg">
</audio>

</body>
</html>
