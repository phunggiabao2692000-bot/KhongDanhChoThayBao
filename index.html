</div>
</div>

];

let colors=["#ffd92f","#ff5252","#39a9ff","#35c759",

<path d="M55 17L68 21 55 25z" fill="#ff8c20" stroke="#222" stroke-width="2"/>
<path d="M23 40l-3 7M34 40l-2 7" stroke="#e87518" stroke-width="3"/>
${acc}</svg>`;

function create(){
let track=document.getElementById("track");
track.innerHTML='<div id="finish"></div>';
ducks=[];

names.forEach((n,i)=>{
let lane=document.createElement("div");
lane.className="lane";
lane.innerHTML=`
<div class="num">${i+1}</div>
<div class="duck">${duckSVG(colors[i%8],i)}</div>
<div class="name">${n}</div>`;
track.appendChild(lane);

ducks.push({
el:lane.querySelector(".duck"),
x:65,
speed:2+Math.random()*3,
name:n
});
});
}

function startRace(){
if(running)return;
running=true;
startTime=Date.now();
run();
}

function run(){
if(!running)return;

let finish=document.getElementById("track").clientWidth*.92;

for(let d of ducks){
d.speed+=Math.random()-.5;
d.speed=Math.max(1,Math.min(6,d.speed));
d.x+=d.speed;
d.el.style.left=d.x+"px";

if(d.x+65>=finish){
running=false;
setTimeout(()=>alert("🏆 Người thắng: "+d.name),100);
return;
}
}
