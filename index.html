<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duck Race Name Picker</title>

<style>

/* =========================
   CÀI ĐẶT CHUNG
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
    color: #17324d;
}


/* =========================
   HEADER
========================= */

header {
    height: 85px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    box-shadow: 0 3px 10px rgba(0,0,0,.12);

    position: relative;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #f5a900;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.edit-btn {
    background: #ffb718;
    color: white;

    padding: 15px 22px;

    border-radius: 15px;

    font-size: 16px;
}

.reset-btn {
    background: white;
    color: #24516d;

    padding: 12px 18px;

    border-radius: 15px;

    font-size: 22px;

    box-shadow: 0 2px 7px #bbb;
}


/* =========================
   GAME
========================= */

.game {
    position: relative;

    min-height: 650px;

    overflow: hidden;

    background:
        linear-gradient(
            #8edbff 0%,
            #bceeff 42%,
            #078fc7 42%,
            #0581b7 100%
        );
}


/* MẶT TRỜI */

.sun {
    position: absolute;

    width: 80px;
    height: 80px;

    background: #ffe55c;

    border-radius: 50%;

    top: 30px;
    left: 35px;
}


/* =========================
   TIMER
========================= */

.timer {
    position: relative;

    margin: 35px auto 90px;

    width: 390px;
    height: 90px;

    background: white;

    border: 5px solid #20a9e8;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;

    font-weight: bold;

    letter-spacing: 3px;

    box-shadow: 0 5px 10px rgba(0,0,0,.15);
}


/* =========================
   ĐƯỜNG ĐUA
========================= */

.race-track {
    position: relative;

    width: 100%;

    min-height: 430px;
}


/* LÀN ĐUA */

.lane {
    position: relative;

    height: 53px;

    border-bottom: 1px solid rgba(255,255,255,.18);
}


/* SỐ THỨ TỰ */

.number {
    position: absolute;

    left: 25px;
    top: 8px;

    width: 38px;
    height: 38px;

    background: white;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    font-size: 18px;

    z-index: 5;
}


/* TÊN */

.name {
    position: absolute;

    left: 135px;
    top: 8px;

    background: white;

    padding: 8px 14px;

    border-radius: 12px;

    font-weight: bold;

    font-size: 15px;

    z-index: 4;

    max-width: 200px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================
   VỊT
========================= */

.duck {
    position: absolute;

    left: 70px;
    top: 3px;

    width: 60px;
    height: 45px;

    z-index: 6;

    transition: left .07s linear;

    /* MẶT QUAY SANG PHẢI */
    transform: scaleX(1);

    filter:
        drop-shadow(2px 3px 2px rgba(0,0,0,.25));
}

.duck svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================
   VẠCH ĐÍCH
========================= */

.finish {
    position: absolute;

    right: 7%;

    top: 0;
    bottom: 0;

    width: 15px;

    background: #ff5470;

    border-left: 3px solid white;
    border-right: 3px solid white;

    z-index: 3;
}

.finish-label {
    position: absolute;

    right: calc(7% - 25px);

    top: -28px;

    background: white;

    padding: 6px 8px;

    font-size: 12px;

    font-weight: bold;

    z-index: 8;
}


/* =========================
   BẢNG ĐIỀU KHIỂN
========================= */

.controls {
    background: white;

    padding: 20px 25px 35px;
}

.keypad {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

.keypad button {
    width: 60px;
    height: 52px;

    border-radius: 12px;

    background: #dce8f0;

    color: #17324d;

    font-size: 20px;
}

.keypad .green {
    background: #13ba86;

    color: white;
}


/* START */

.start {
    display: block;

    margin: 20px 0 0 30px;

    background: #ff9417;

    color: white;

    padding: 18px 35px;

    border-radius: 17px;

    font-size: 22px;

    box-shadow: 0 4px 0 #d97000;
}

.start:active {
    transform: translateY(3px);

    box-shadow: 0 1px 0 #d97000;
}


/* =========================
   CỬA SỔ WINNER
========================= */

.winner {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    align-items: center;

    justify-content: center;

    z-index: 100;
}

.winner-box {
    background: white;

    padding: 40px;

    border-radius: 25px;

    text-align: center;

    width: 400px;

    max-width: 90%;
}

.winner-box h1 {
    color: #ff9c00;

    font-size: 35px;
}

.winner-name {
    font-size: 30px;

    font-weight: bold;

    color: #159bd7;
}


/* =========================
   EDIT LIST
========================= */

.edit-panel {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.6);

    z-index: 90;

    align-items: center;

    justify-content: center;
}

.edit-box {
    background: white;

    width: 430px;

    max-width: 90%;

    padding: 25px;

    border-radius: 20px;
}

.edit-box h2 {
    margin-top: 0;
}

textarea {
    width: 100%;

    height: 250px;

    padding: 12px;

    font-size: 17px;

    border: 2px solid #ddd;

    border-radius: 12px;

    resize: vertical;
}

.save-btn {
    margin-top: 15px;

    background: #14bd82;

    color: white;

    padding: 14px 25px;

    border-radius: 12px;

    font-size: 17px;
}

.close-btn {
    margin-top: 15px;

    margin-left: 8px;

    background: #ddd;

    padding: 14px 25px;

    border-radius: 12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 17px;
    }

    .edit-btn {
        padding: 10px;

        font-size: 13px;
    }

    .timer {
        width: 90%;

        font-size: 34px;
    }

    .name {
        left: 130px;

        font-size: 12px;
    }

    .start {
        margin-left: 15px;
    }
}

</style>
</head>


<body>

    </div>

            class="edit-btn"

            ☷ Edit List
